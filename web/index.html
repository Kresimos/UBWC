<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The app is a handset UI at a fixed column width, so zoom only ever leaves a
     member scrolled into a corner of a layout that was already the right size.
     user-scalable/maximum-scale cover Android; iOS Safari has ignored both
     since iOS 10, so js/main.js refuses the pinch gesture directly and
     touch-action in tokens.css kills the double-tap. -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<!-- White, so the status-bar area is white in Safari and in the Android
     installed app; iOS ignores this in standalone and is handled by CSS. -->
<meta name="theme-color" content="#ffffff">
<title>UBWC Kit</title>
<link rel="icon" href="/assets/logo.png">
<!-- iOS renders transparent icon pixels black, so the home-screen icon is the
     badge flattened onto white; the in-app mark keeps its transparency. -->
<link rel="apple-touch-icon" href="/assets/icon-180.png">
<!--
  Home-screen / standalone launch. Added to the home screen, these tell iOS and
  Android to open the app fullscreen with no browser chrome (no URL bar). The
  manifest does the same for Android/Chrome; the apple-* tags do it for iOS
  Safari. status-bar-style "default" keeps the app's content below the system
  status bar rather than under it, so nothing needs re-padding.
-->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="UBWC Kit">
<link rel="manifest" href="/assets/manifest.json">
<!-- ?v is bumped whenever the CSS changes, so Safari refetches it instead of
     serving a stale cached copy. -->
<link rel="stylesheet" href="/css/tokens.css?v=6">
<link rel="stylesheet" href="/css/screens.css?v=6">
</head>
<body>
<!--
  One device, one screen stack. On a phone the .phone wrapper is invisible and
  the app fills the viewport; on a laptop it draws the handset the sketches were
  designed in, because committee admin happens on a desktop and the layout is
  built for a 390px column either way.
-->
<div class="phone">
  <div class="screen">
    <div class="notch" aria-hidden="true"></div>
    <div class="statusbar" aria-hidden="true">
      <span data-clock>9:41</span>
      <span class="dots">
        <svg class="sig" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="17" height="12" viewBox="0 0 17 12" fill="currentColor"><path d="M8.5 2.4c2.2 0 4.2.8 5.7 2.2l1.3-1.4A10 10 0 0 0 8.5.5 10 10 0 0 0 1 3.2l1.3 1.4A8 8 0 0 1 8.5 2.4Zm0 3.6c1.2 0 2.3.45 3.1 1.2l1.3-1.4a7 7 0 0 0-8.8 0l1.3 1.4A4.6 4.6 0 0 1 8.5 6Zm0 3.4L10.4 8a2.7 2.7 0 0 0-3.8 0Z"/></svg>
        <span class="batt"></span>
      </span>
    </div>

    <div class="app" id="app"><div class="booting"></div></div>

    <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
    <div class="home-ind" aria-hidden="true"></div>

    <div class="overlay" id="overlay" hidden></div>
  </div>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>
